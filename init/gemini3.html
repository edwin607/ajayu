<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>COGNITIVE FLOW TEST</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');
        
        body {
            margin: 0;
            overflow: hidden;
            background-color: #000;
            color: #ccffcc;
            font-family: 'Share Tech Mono', monospace;
            cursor: crosshair;
        }
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
            box-sizing: border-box;
            z-index: 10;
        }
        
        /* Analysis HUD */
        .hud-panel {
            background: rgba(0, 0, 0, 0.7);
            border: 1px solid #333;
            padding: 10px;
            width: 280px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .hud-title {
            font-size: 14px;
            color: #666;
            border-bottom: 1px solid #333;
            padding-bottom: 5px;
            margin-bottom: 5px;
            letter-spacing: 1px;
        }
        .metric-row {
            display: flex;
            justify-content: space-between;
            font-size: 16px;
        }
        .metric-val {
            font-weight: bold;
        }
        
        .bar-container {
            width: 100%;
            height: 6px;
            background: #222;
            position: relative;
        }
        .bar-fill {
            height: 100%;
            width: 0%;
            transition: width 0.1s;
        }

        .gold-text { color: #FFD700; }
        .red-text { color: #FF4500; }
        .blue-text { color: #1E90FF; }

        /* Graph visualization */
        #graph-canvas {
            width: 100%;
            height: 60px;
            background: #111;
            border: 1px solid #333;
        }

        #crosshair {
            position: fixed;
            top: 50%; left: 50%;
            width: 20px; height: 20px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: 5;
        }

        #status-msg {
            position: absolute;
            bottom: 40px;
            width: 100%;
            text-align: center;
            font-size: 18px;
            letter-spacing: 2px;
            text-shadow: 0 0 5px #000;
        }
    </style>
</head>
<body>

    <div id="ui-layer">
        <div class="hud-panel">
            <div class="hud-title">:: SYNCHRONIZATION METRICS ::</div>
            
            <div class="metric-row gold-text">
                <span>COHERENCE</span>
                <span id="coherence-val">0.00</span>
            </div>
            <div class="bar-container">
                <div id="coherence-bar" class="bar-fill" style="background: #FFD700"></div>
            </div>

            <div class="metric-row red-text" style="margin-top:10px;">
                <span>DISSONANCE</span>
                <span id="dissonance-val">0.00</span>
            </div>
            <div class="bar-container">
                <div id="dissonance-bar" class="bar-fill" style="background: #FF4500"></div>
            </div>

            <div class="hud-title" style="margin-top:15px;">:: VECTOR HISTORY ::</div>
            <canvas id="graph-canvas"></canvas>
            
            <div style="font-size:10px; color:#555; margin-top:5px;">
                DELTA_V: <span id="delta-v">0.00</span> rad
            </div>
        </div>

        <div id="status-msg">
            DETECTING INPUT...
        </div>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { AsciiEffect } from 'three/addons/effects/AsciiEffect.js';

        // --- CONFIG ---
        const GRID_SIZE = 16;
        const SPACING = 1.2;
        
        // --- STATE ---
        let scene, camera, renderer, effect;
        let gridItems = [];
        let time = 0;
        let isPaused = false;
        
        // Input Tracking
        const mouse = new THREE.Vector2();
        const prevMouse = new THREE.Vector2();
        const mouseVel = new THREE.Vector2();
        
        // Metrics
        let coherenceScore = 0;
        let dissonanceScore = 0;
        const historyGraph = [];

        window.addEventListener('message', (e) => {
             if (e.data && e.data.type === 'PAUSE_GAME') {
                 isPaused = e.data.payload;
             }
        });

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x000000);

            // Orthographic for a scientific/flat look
            const aspect = window.innerWidth / window.innerHeight;
            const frustumSize = 20;
            camera = new THREE.OrthographicCamera(
                frustumSize * aspect / -2, frustumSize * aspect / 2,
                frustumSize / 2, frustumSize / -2,
                1, 1000
            );
            camera.position.set(0, 0, 50);

            renderer = new THREE.WebGLRenderer();
            renderer.setSize(window.innerWidth, window.innerHeight);

            // High contrast ASCII set
            const chars = ' .`^",:;Il!i><~+_-?][}{1)(|/tfjrxnuvczXYUJCLQ0OZmwqpdbkhao*#MW&8%B@$';
            effect = new AsciiEffect(renderer, chars, { invert: true, color: true });
            effect.setSize(window.innerWidth, window.innerHeight);
            effect.domElement.style.backgroundColor = 'black';
            document.body.appendChild(effect.domElement);

            createGrid();

            window.addEventListener('mousemove', onMouseMove);
            window.addEventListener('resize', onResize);

            animate();
        }

        function createGrid() {
            const geometry = new THREE.BoxGeometry(0.8, 0.2, 0.2); // Bar shape
            
            for(let x = -GRID_SIZE/2; x < GRID_SIZE/2; x++) {
                for(let y = -GRID_SIZE/2; y < GRID_SIZE/2; y++) {
                    const material = new THREE.MeshBasicMaterial({ color: 0x1E90FF });
                    const mesh = new THREE.Mesh(geometry, material);
                    
                    mesh.position.set(x * SPACING, y * SPACING, 0);
                    mesh.userData = {
                        baseX: x * SPACING,
                        baseY: y * SPACING,
                        flowAngle: 0,
                        state: 'neutral' // neutral, coherent, dissonant
                    };
                    
                    scene.add(mesh);
                    gridItems.push(mesh);
                }
            }
        }

        function onMouseMove(event) {
            // Normalized Device Coordinates (-1 to +1)
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
        }

        function updateMetrics(alignment) {
            // alignment is -1 (opposing) to 1 (aligned)
            
            if (alignment > 0.5) {
                coherenceScore += 0.05;
                dissonanceScore -= 0.02;
            } else if (alignment < -0.2) {
                dissonanceScore += 0.05;
                coherenceScore -= 0.02;
            } else {
                coherenceScore -= 0.01;
                dissonanceScore -= 0.01;
            }
            
            // Clamp
            coherenceScore = Math.max(0, Math.min(10, coherenceScore));
            dissonanceScore = Math.max(0, Math.min(10, dissonanceScore));

            // Update UI
            document.getElementById('coherence-val').innerText = coherenceScore.toFixed(2);
            document.getElementById('coherence-bar').style.width = (coherenceScore * 10) + '%';
            
            document.getElementById('dissonance-val').innerText = dissonanceScore.toFixed(2);
            document.getElementById('dissonance-bar').style.width = (dissonanceScore * 10) + '%';

            // Graph
            historyGraph.push(alignment);
            if(historyGraph.length > 50) historyGraph.shift();
            drawGraph();
        }

        function drawGraph() {
            const canvas = document.getElementById('graph-canvas');
            const ctx = canvas.getContext('2d');
            const w = canvas.width = canvas.offsetWidth;
            const h = canvas.height = canvas.offsetHeight;
            
            ctx.clearRect(0,0,w,h);
            ctx.fillStyle = '#111';
            ctx.fillRect(0,0,w,h);
            
            ctx.beginPath();
            ctx.strokeStyle = '#FFD700';
            ctx.lineWidth = 2;
            
            for(let i=0; i<historyGraph.length; i++) {
                const val = historyGraph[i]; // -1 to 1
                const x = (i / 50) * w;
                const y = h/2 - (val * (h/2)); // Invert Y
                if(i===0) ctx.moveTo(x,y);
                else ctx.lineTo(x,y);
            }
            ctx.stroke();
        }

        function update() {
            if (isPaused) return;

            time += 0.01;

            // Calculate Mouse Velocity
            mouseVel.subVectors(mouse, prevMouse);
            const mouseSpeed = mouseVel.length();
            const mouseAngle = Math.atan2(mouseVel.y, mouseVel.x);
            prevMouse.copy(mouse);

            let totalAlignment = 0;
            let activeCount = 0;

            // Update Grid
            gridItems.forEach(mesh => {
                const u = mesh.userData;
                
                // 1. Calculate Field Flow at this position (Simplex-like noise)
                const noiseVal = Math.sin(u.baseX * 0.2 + time) * Math.cos(u.baseY * 0.2 + time * 0.5);
                // Flow angle changes over time and space
                u.flowAngle = noiseVal * Math.PI * 2;
                
                // 2. Interaction
                // Convert mouse position to world space for distance check
                // Simple approx since ortho camera at z=50, scaling is linear
                // Ortho size 20 means visible height is 20 units.
                const aspect = window.innerWidth / window.innerHeight;
                const mouseWorldX = mouse.x * (10 * aspect);
                const mouseWorldY = mouse.y * 10;
                
                const dx = mouseWorldX - u.baseX;
                const dy = mouseWorldY - u.baseY;
                const dist = Math.sqrt(dx*dx + dy*dy);
                
                let color = 0x1E90FF; // Default Blue
                let scale = 1;
                let rotation = u.flowAngle;
                
                // Interaction Radius
                if (dist < 4) {
                    if (mouseSpeed > 0.001) {
                        // Calculate alignment between Flow and Mouse Movement
                        // Smallest difference between angles
                        let angleDiff = mouseAngle - u.flowAngle;
                        // Normalize to -PI to PI
                        while (angleDiff > Math.PI) angleDiff -= Math.PI*2;
                        while (angleDiff < -Math.PI) angleDiff += Math.PI*2;
                        
                        const alignment = Math.cos(angleDiff); // 1 = aligned, -1 = opposed
                        
                        totalAlignment += alignment;
                        activeCount++;
                        
                        if (alignment > 0.5) {
                            // Coherent (Gold)
                            color = 0xFFD700;
                            scale = 1.5;
                            // Snap rotation to flow to show "locking in"
                            rotation = u.flowAngle; 
                        } else if (alignment < -0.5) {
                            // Dissonant (Red)
                            color = 0xFF4500;
                            scale = 0.5;
                            rotation += Math.random(); // Jitter
                        } else {
                            // Neutral
                            color = 0x555555;
                        }
                    }
                }

                mesh.rotation.z = rotation;
                mesh.material.color.setHex(color);
                mesh.scale.set(scale, scale, 1);
            });

            // Update Metrics based on average alignment of active cells
            if (activeCount > 0) {
                const avgAlignment = totalAlignment / activeCount;
                updateMetrics(avgAlignment);
                document.getElementById('delta-v').innerText = avgAlignment.toFixed(3);
                
                const msgEl = document.getElementById('status-msg');
                if (avgAlignment > 0.7) {
                    msgEl.innerText = "SYNC ESTABLISHED";
                    msgEl.style.color = "#FFD700";
                } else if (avgAlignment < -0.5) {
                    msgEl.innerText = "PATTERN DISRUPTION";
                    msgEl.style.color = "#FF4500";
                } else {
                    msgEl.innerText = "ACQUIRING SIGNAL...";
                    msgEl.style.color = "#555";
                }
            } else {
                updateMetrics(0); // Decay
                document.getElementById('status-msg').innerText = "NO INPUT DETECTED";
                document.getElementById('status-msg').style.color = "#333";
            }
        }

        function onResize() {
            const aspect = window.innerWidth / window.innerHeight;
            const frustumSize = 20;
            
            camera.left = -frustumSize * aspect / 2;
            camera.right = frustumSize * aspect / 2;
            camera.top = frustumSize / 2;
            camera.bottom = -frustumSize / 2;
            camera.updateProjectionMatrix();

            renderer.setSize(window.innerWidth, window.innerHeight);
            effect.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            update();
            effect.render(scene, camera);
        }

        init();
    </script>
</body>
</html>
